<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation and Submission</title>

</head>
<body>
    
    <form action="" method="post">
        {% csrf_token %}
       <input type="text" name="name" placeholder="Enter your name">
       <span style="color: red;">{{ name_error }}</span><br><br>
       <input type="text" name="email" placeholder="Enter your email">
       <span style="color: red;">{{ email_error }}</span><br><br>
       <input type="text" name="password" placeholder="Enter your password">
       <span style="color: red;">{{ password_error }}</span><br><br>
        <input type="submit" value="Submit">

    </form>
    <h2>Submitted Details</h2>
    {% if submitted_details %}
    <p>Name: {{ submitted_details.name }}</p>
    <p>Email: {{ submitted_details.email }}</p>
    <p>Password: {{ submitted_details.password }}</p>
    {% endif %}
</body>
</html>
