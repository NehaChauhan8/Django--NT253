<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% load static %}
    {% for item in product_list %}
    <img src="{% static item.image %}" height="200" width="200" alt="{{item.name}}">
    <p>{{item.name}}</p>
    <p>{{item.brand}}</p>
    <p>{{item.price}}</p>

    {% endfor %}
</body>
</html>
